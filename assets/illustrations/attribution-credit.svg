<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Attribution credit across touchpoints">
  <rect width="720" height="320" fill="#f4f7f8"/>
  <text x="24" y="36" font-family="Georgia, serif" font-size="20" fill="#1c2430">Attribution credit (educational)</text>
  <text x="24" y="58" font-family="system-ui,sans-serif" font-size="12" fill="#5a6570">Same journey · different models change who gets credit</text>
  <g font-family="system-ui,sans-serif" font-size="13">
    <rect x="40" y="90" width="110" height="44" rx="8" fill="#d7eef0" stroke="#2a7a82"/>
    <text x="95" y="117" text-anchor="middle" fill="#1c2430">Paid Social</text>
    <rect x="200" y="90" width="110" height="44" rx="8" fill="#d7eef0" stroke="#2a7a82"/>
    <text x="255" y="117" text-anchor="middle" fill="#1c2430">Organic Search</text>
    <rect x="360" y="90" width="110" height="44" rx="8" fill="#d7eef0" stroke="#2a7a82"/>
    <text x="415" y="117" text-anchor="middle" fill="#1c2430">Email</text>
    <rect x="520" y="90" width="120" height="44" rx="8" fill="#2a7a82"/>
    <text x="580" y="117" text-anchor="middle" fill="#fff">Purchase</text>
    <path d="M150 112 H200 M310 112 H360 M470 112 H520" stroke="#5a6570" stroke-width="2" marker-end="url(#a)"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="12" fill="#1c2430">
    <text x="40" y="180">Last-click ’ mostly Email</text>
    <text x="40" y="204">First-click ’ mostly Paid Social</text>
    <text x="40" y="228">Data-driven ’ shares credit across eligible touches</text>
    <text x="40" y="268" fill="#5a6570">Always name the model in stakeholder updates.</text>
  </g>
</svg>
