    <rect x="460" y="150" width="220" height="70" rx="8" fill="#fff" stroke="#c9d2d8"/>
    <text x="476" y="178" font-weight="700">utm_campaign</text>
    <text x="476" y="200" fill="#5a6570">Name (spring)</text>
    <text x="40" y="260" fill="#5a6570">Preserve query params through redirects  or campaign data becomes Direct/Referral noise.</text>
  </g>
</svg>
