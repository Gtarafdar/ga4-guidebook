<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="gtag vs GTM">
  <rect width="720" height="260" fill="#f4f7f8"/>
  <text x="24" y="36" font-family="Georgia,serif" font-size="20" fill="#1c2430">gtag.js vs GTM</text>
  <rect x="40" y="70" width="300" height="150" rx="14" fill="#fff" stroke="#c5d4d8"/>
  <text x="60" y="110" font-family="system-ui" font-size="16" font-weight="700" fill="#2a7a82">gtag.js</text>
  <text x="60" y="140" font-family="system-ui" font-size="14" fill="#5a6570">Code on page · simple sites</text>
  <text x="60" y="170" font-family="system-ui" font-size="14" fill="#5a6570">Fewer moving parts</text>
  <rect x="380" y="70" width="300" height="150" rx="14" fill="#e8f3f4" stroke="#2a7a82"/>
  <text x="400" y="110" font-family="system-ui" font-size="16" font-weight="700" fill="#1c2430">Google Tag Manager</text>
  <text x="400" y="140" font-family="system-ui" font-size="14" fill="#5a6570">Container · marketers ship tags</text>
  <text x="400" y="170" font-family="system-ui" font-size="14" fill="#5a6570">Versioning &amp; many vendors</text>
</svg>